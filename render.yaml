services:
  - type: web
    name: aura-api
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: STT_MODEL
        value: gemini-3.5-flash-lite
      - key: TTS_MODEL
        value: gemini-3.8-flash-lite-tts
      - key: TTS_VOICE
        value: Kore
      - key: MAX_SESSIONS
        value: "8"
  - type: web
    name: aura-web
    runtime: docker
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

